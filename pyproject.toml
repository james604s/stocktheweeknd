[project]
name = "stockwatch"
version = "0.1.0"
description = "個人用美股每日觀測系統：日報 + 盤中推播（Discord）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "finnhub-python>=2.4",
    "exchange-calendars>=4.5",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "jobs", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "jobs"]
